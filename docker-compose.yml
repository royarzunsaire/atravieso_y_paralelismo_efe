# Levanta backend + frontend juntos para verificar localmente en el servidor
# Linux (concerto), simulando la red compartida de una OCI Container Instance.
#   docker compose build
#   docker compose up
# Luego abrir  http://IP-servidor:8080  y probar login real contra Oracle.

services:
  backend:
    build:
      context: ./pwa-backend
    image: ayp-backend:local
    # El .env del backend (Oracle ORDS, JWT, session y la API del cliente:
    # SHAREPOINT_API_URL / SHAREPOINT_API_SECRET) NO se commitea: es el mismo que ya
    # usas localmente. Debe existir en ./pwa-backend/.env
    env_file:
      - ./pwa-backend/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      TRUST_PROXY: "1"      # nginx del frontend es el único proxy delante (límite de intentos de login)
    expose:
      - "3001"            # visible solo dentro de la red de compose (no al host)
    restart: unless-stopped
    # Endurecimiento (H-12): sin privilegios extra, sin capacidades de Linux y sistema de archivos de solo lectura
    # (el backend no escribe a disco; /tmp queda como memoria temporal).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./pwa-frontend
      args:
        VITE_API_URL: ""          # rutas relativas → reverse proxy de nginx
    image: ayp-frontend:local
    environment:
      # nginx alcanza al backend por el nombre de servicio de compose.
      # En OCI Container Instance esto cambia a "localhost".
      # Origen(es) a los que el navegador puede conectarse (CSP): el gateway de OCI donde están la API de SharePoint y el backend.
      # Se puede sobrescribir al ejecutar:  CSP_CONNECT_EXTRA=https://otro-gateway docker compose up
      CSP_CONNECT_EXTRA: "${CSP_CONNECT_EXTRA:-https://gtibyxnoeyzrfkb5a26vg53vfi.apigateway.sa-santiago-1.oci.customer-oci.com}"
      # Dirección del backend que usa el NAVEGADOR. Vacía = mismo origen (nginx hace de proxy hacia BACKEND_HOST); con el backend detrás de un
      # API Gateway: API_URL=https://<gateway>/<prefijo>.
      API_URL: "${API_URL:-}"
      BACKEND_HOST: backend
      BACKEND_PORT: "3001"
    ports:
      - "${FRONTEND_PORT:-8080}:8080"   # puerto del host configurable
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
